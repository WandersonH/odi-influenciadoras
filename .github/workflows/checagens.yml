name: Checagens (Google Fact Check Tools)

# Porta do coletor do ODI Atlas. Grátis. Chave FACTCHECK_API_KEY; sem ela, a do YouTube (a API precisa estar ativa no projeto).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checagens:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes
        run: python -m unittest discover -s tests -v
      - name: Checagens
        id: c
        continue-on-error: true
        env:
          FACTCHECK_API_KEY: ${{ secrets.FACTCHECK_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          rc=0; python scripts/collect_checagens.py > c.txt 2>&1 || rc=$?
          while IFS= read -r l; do echo "::notice title=Checagens::$(echo "$l" | cut -c1-900)"; done < c.txt
          rm -f c.txt; exit $rc
      - name: Gravar
        if: always()
        run: |
          git config user.name "odi-influenciadoras-coletor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet && exit 0
          git commit -q -m "Checagens (run ${{ github.run_id }})"
          for t in 1 2 3 4 5; do { git push -q origin HEAD:main 2>/dev/null || { git pull -q --rebase origin main && git push -q origin HEAD:main; }; } && exit 0; sleep $((t * 10)); done
          exit 1
      - name: Resultado
        if: steps.c.outcome == 'failure'
        run: exit 1

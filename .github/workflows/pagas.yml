name: Coleta paga — Instagram e TikTok (Apify, com teto)

# Só disparo manual. O teto por etapa está em data/config/coleta.json (apify.etapas), com a autorização do responsável.
# Conta Apify dedicada (segredo APIFY_TOKEN_INFL). Nenhuma consulta de saldo ou de limites.
on:
  workflow_dispatch:
    inputs:
      rede:
        description: "rede"
        type: choice
        options: [ambas, instagram, tiktok, x, terceiros_x]
        default: ambas
      etapa:
        description: "etapa"
        type: choice
        options: [teste, posts]
        default: teste
      ator:
        description: "ator Apify (vazio = o de coleta.json)"
        type: string
        default: ""

concurrency:
  group: coleta-influenciadoras
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes
        run: python -m unittest discover -s tests -v
      - name: Repositório privado (bruto da Apify)
        id: interno
        env:
          TOKEN: ${{ secrets.ODI_INTERNO_TOKEN }}
        run: |
          if [ -n "$TOKEN" ] && git clone -q --depth 1 "https://x-access-token:${TOKEN}@github.com/WandersonH/odi-secret-infl-.git" "$RUNNER_TEMP/interno"; then
            echo "dir=$RUNNER_TEMP/interno" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Repositório privado::sem acesso ao odi-secret-infl- — o bruto NÃO será guardado"
          fi
      - name: Coleta
        id: coleta
        continue-on-error: true
        env:
          APIFY_TOKEN_INFL: ${{ secrets.APIFY_TOKEN_INFL }}
          INFL_INTERNO_DIR: ${{ steps.interno.outputs.dir }}
        run: |
          case "${{ github.event.inputs.rede }}" in ambas) redes="instagram tiktok";; *) redes="${{ github.event.inputs.rede }}";; esac
          rc=0
          if [ "$redes" = "terceiros_x" ]; then
            python scripts/collect_terceiros_x.py > o.txt 2>&1 || rc=1
            while IFS= read -r l; do echo "::notice title=terceiros X::$(echo "$l" | cut -c1-900)"; done < o.txt
            rm -f o.txt; exit $rc
          fi
          for r in $redes; do
            extra=""; if [ -n "${{ github.event.inputs.ator }}" ]; then extra="--ator ${{ github.event.inputs.ator }}"; fi
            python scripts/collect_apify_posts.py --rede "$r" --etapa "${{ github.event.inputs.etapa }}" $extra > o.txt 2>&1 || rc=1
            while IFS= read -r l; do echo "::notice title=$r::$(echo "$l" | cut -c1-900)"; done < o.txt
          done
          rm -f o.txt; exit $rc
      - name: O que dizem (temas por rede)
        if: always()
        continue-on-error: true
        run: pip install -q numpy networkx && python scripts/build_o_que_dizem.py && python scripts/build_engajamento.py && python scripts/build_redes.py && python scripts/build_corpus.py
      - name: Gravar (público)
        if: always()
        run: |
          git config user.name "odi-influenciadoras-coletor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet && exit 0
          git commit -q -m "Coleta Apify ${{ github.event.inputs.rede }} ${{ github.event.inputs.etapa }} (run ${{ github.run_id }})"
          for t in 1 2 3; do { git push -q origin HEAD:main 2>/dev/null || { git pull -q --rebase origin main && git push -q origin HEAD:main; }; } && exit 0; sleep $((t * 10)); done
          exit 1
      - name: Gravar bruto (privado)
        if: always() && steps.interno.outputs.dir != ''
        run: |
          cd "${{ steps.interno.outputs.dir }}"
          git config user.name "odi-influenciadoras-coletor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "Bruto Apify (run ${{ github.run_id }})"
          for t in 1 2 3; do { git push -q origin HEAD:main 2>/dev/null || { git pull -q --rebase origin main && git push -q origin HEAD:main; }; } && exit 0; sleep $((t * 10)); done
          exit 1
      - name: Resultado
        if: steps.coleta.outcome == 'failure'
        run: |
          echo "::error title=Coleta paga::alguma rede falhou (ver anotações e manifestos)"
          exit 1

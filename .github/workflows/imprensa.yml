name: Imprensa (Google Notícias) e rede de circulação do caso Hamas (sem custo)

on:
  workflow_dispatch:

concurrency:
  group: imprensa
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  imprensa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: pip install -q networkx numpy scipy
      - name: Testes
        run: python -m unittest discover -s tests -v
      - name: Imprensa e circulação
        id: i
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          rc=0
          { python scripts/collect_imprensa.py && python scripts/build_circulacao.py && python scripts/build_rede_imprensa.py; } > o.txt 2>&1 || rc=$?
          while IFS= read -r l; do echo "::notice title=Imprensa::$(echo "$l" | cut -c1-900)"; done < o.txt
          rm -f o.txt; exit $rc
      - name: Gravar
        if: always()
        run: |
          git config user.name "odi-influenciadoras-coletor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet && exit 0
          git commit -q -m "Imprensa e circulação (run ${{ github.run_id }})"
          for t in 1 2 3 4 5; do { git push -q origin HEAD:main 2>/dev/null || { git pull -q --rebase origin main && git push -q origin HEAD:main; }; } && exit 0; sleep $((t * 10)); done
          exit 1
      - name: Resultado
        if: steps.i.outcome == 'failure'
        run: exit 1
